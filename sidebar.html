<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- Google Fonts: Kiwi Maru の読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: transparent !important;
      color: #E8E8E8;
      font-family: 'Kiwi Maru', serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
    }

    /* 外側のパネル（枠線なし、指定の背景色） */
    .panel-card {
      width: 100%;
      height: 100%;
      background: #0B3041;
      border: none !important; /* ★ 枠線なし */
      border-radius: 16px;
      overflow: hidden;
      box-shadow: none !important;
      position: relative;
      transition: background 0.4s ease;
    }

    /* 画像単体の時は枠も背景も完全に透明 */
    .panel-card.image-only-mode {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }

    /* コンテンツ全体 */
    .content-box {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      transition: opacity 0.4s ease;
      opacity: 1;
    }

    .content-box.fade-out {
      opacity: 0;
    }

    /* 1. タイトルエリア（上） */
    .title-container {
      padding: 20px 20px 8px 20px;
      background: #0B3041;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 26px;
      font-weight: 500;
      color: #E8E8E8; /* ★ 指定文字色 */
      line-height: 1.3;
      font-family: 'Kiwi Maru', serif;
    }

    /* 2. 画像エリア（中央） */
    .image-container {
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0B3041;
      overflow: hidden;
      min-height: 0;
      padding: 10px 16px;
    }

    .image-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    /* 画像単体の時は余白なし・角丸なし・完全透明 */
    .image-only-mode .image-container {
      padding: 0;
      background: transparent !important;
    }
    .image-only-mode .image-container img {
      border-radius: 0;
    }

    /* 3. 説明エリア（下） */
    .desc-container {
      padding: 8px 20px 20px 20px;
      background: #0B3041;
      flex-shrink: 0;
    }

    .panel-desc {
      font-size: 18px;
      color: #E8E8E8; /* ★ 指定文字色 */
      line-height: 1.6;
      white-space: pre-wrap;
      font-family: 'Kiwi Maru', serif;
    }

    /* --- 文章のみのレイアウト --- */
    .text-only {
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 32px 24px;
    }

    .text-only .title-container,
    .text-only .desc-container {
      padding: 0;
      background: transparent;
    }

    .text-only .panel-title {
      font-size: 32px;
      margin-bottom: 16px;
    }

    .text-only .panel-desc {
      font-size: 22px;
    }
  </style>
</head>
<body>

  <div id="card" class="panel-card" style="display:none;">
    <div id="contentBox" class="content-box">
      <!-- 1. タイトル（上） -->
      <div id="titleBox" class="title-container">
        <div id="panelTitle" class="panel-title"></div>
      </div>

      <!-- 2. 画像（中央） -->
      <div id="imgBox" class="image-container">
        <img id="panelImg" src="" alt="">
      </div>

      <!-- 3. 説明文（下） -->
      <div id="descBox" class="desc-container">
        <div id="panelDesc" class="panel-desc"></div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://shikosai-signage-api.shikosai.workers.dev/api/sidebar';
    let items = [];
    let currentIndex = 0;
    let timer = null;

    async function fetchSidebarData() {
      try {
        const res = await fetch(API_URL + '?t=' + Date.now());
        const data = await res.json();
        items = data || [];
      } catch (e) {
        console.warn("データ取得エラー:", e);
      }
    }

    async function startLoop() {
      await fetchSidebarData();
      showNextItem();
    }

    async function showNextItem() {
      if (items.length === 0) {
        document.getElementById('card').style.display = 'none';
        setTimeout(startLoop, 5000);
        return;
      }

      const item = items[currentIndex % items.length];
      const card = document.getElementById('card');
      const contentBox = document.getElementById('contentBox');
      const titleBox = document.getElementById('titleBox');
      const imgBox = document.getElementById('imgBox');
      const descBox = document.getElementById('descBox');
      const panelTitle = document.getElementById('panelTitle');
      const panelImg = document.getElementById('panelImg');
      const panelDesc = document.getElementById('panelDesc');

      contentBox.classList.add('fade-out');

      setTimeout(() => {
        const hasImage = !!item.image_data;
        const hasTitle = !!(item.title && item.title.trim() !== "");
        const hasDesc = !!(item.description && item.description.trim() !== "");

        card.style.display = "block";
        contentBox.className = "content-box";

        if (hasImage && !hasTitle && !hasDesc) {
          card.className = "panel-card image-only-mode";
          titleBox.style.display = "none";
          descBox.style.display = "none";
          imgBox.style.display = "flex";
          panelImg.src = item.image_data;
        } else if (hasImage) {
          card.className = "panel-card";

          if (hasTitle) {
            titleBox.style.display = "block";
            panelTitle.innerText = item.title;
          } else {
            titleBox.style.display = "none";
          }

          imgBox.style.display = "flex";
          panelImg.src = item.image_data;

          if (hasDesc) {
            descBox.style.display = "block";
            panelDesc.innerText = item.description;
          } else {
            descBox.style.display = "none";
          }
        } else {
          card.className = "panel-card";
          contentBox.classList.add('text-only');
          imgBox.style.display = "none";

          if (hasTitle) {
            titleBox.style.display = "block";
            panelTitle.innerText = item.title;
          } else {
            titleBox.style.display = "none";
          }

          if (hasDesc) {
            descBox.style.display = "block";
            panelDesc.innerText = item.description;
          } else {
            descBox.style.display = "none";
          }
        }

        contentBox.classList.remove('fade-out');

        currentIndex++;
        const duration = (item.duration || 10) * 1000;

        if (currentIndex % items.length === 0) {
          timer = setTimeout(async () => {
            await fetchSidebarData();
            showNextItem();
          }, duration);
        } else {
          timer = setTimeout(showNextItem, duration);
        }
      }, 400);
    }

    startLoop();
  </script>
</body>
</html>
