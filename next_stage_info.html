<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background-color: transparent !important;
      overflow: hidden !important;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      font-family: 'Kiwi Maru', serif;
    }

    .next-box {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      background: rgba(10, 25, 40, 0.9);
      border-left: 4px solid #FF9933;
      border: 1px solid rgba(255, 153, 51, 0.4);
      border-left-width: 5px;
      padding: 8px 24px 8px 16px;
      border-radius: 6px;
      white-space: nowrap;
      box-shadow: 2px 4px 12px rgba(0, 0, 0, 0.5);
    }

    .next-tag {
      font-size: 18px;
      font-weight: 500;
      color: #FF9933;
      letter-spacing: 1px;
    }

    .next-time-area {
      background: rgba(10, 25, 40, 0.85);
      border: 1px solid rgba(0, 255, 204, 0.6);
      color: #00FFCC;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.5px;
      padding: 4px 14px;
      border-radius: 4px;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.25);
      display: flex;
      align-items: center;
    }

    .time-orig-struck {
      text-decoration: line-through;
      text-decoration-color: #ff3344;
      text-decoration-thickness: 2px;
      color: #94a3b8;
      margin-right: 8px;
    }

    .time-delayed {
      color: #ff4d4f;
      font-weight: bold;
      text-shadow: 0 0 6px rgba(255, 77, 79, 0.6);
    }
  </style>
</head>
<body>

  <div class="next-box" id="nextBox">
    <span class="next-tag" id="nextTag">読込中...</span>
    <div class="next-time-area" id="nextTime" style="display: none;">--:--</div>
  </div>

  <script>
    const API_URL = 'https://shikosai-signage-api.shikosai.workers.dev/api/state';

    function padTime(t) {
      if (!t) return '';
      const p = t.split(':');
      return p.length === 2 ? ('0' + p[0]).slice(-2) + ':' + ('0' + p[1]).slice(-2) : t;
    }

    function addMinutes(timeStr, minutesToAdd) {
      if (!timeStr || minutesToAdd === 0) return timeStr;
      const parts = timeStr.split(':');
      let h = parseInt(parts[0], 10);
      let m = parseInt(parts[1], 10) + minutesToAdd;
      h += Math.floor(m / 60);
      m = m % 60;
      return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    }

    function getCurrentTimeStr() {
      const now = new Date();
      return String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }

    async function fetchNextStage() {
      try {
        const res = await fetch(API_URL + '?t=' + Date.now());
        const data = await res.json();
        const state = data.state || {};
        const timetable = data.timetable || [];
        const isAuto = state.is_auto !== 0;
        const delay = parseInt(state.delay_minutes, 10) || 0;
        const nowTime = getCurrentTimeStr();

        let currentIndex = state.current_index;

        if (isAuto) {
          currentIndex = -1;
          for (let i = 0; i < timetable.length; i++) {
            const start = addMinutes(padTime(timetable[i].start_time), delay);
            const end = addMinutes(padTime(timetable[i].end_time), delay);
            if (nowTime >= start && nowTime < end) {
              currentIndex = i;
              break;
            }
          }
        }

        let nextStageItem = null;
        let searchStartIndex = currentIndex >= 0 ? currentIndex + 1 : 0;
        
        if (currentIndex === -1) {
          for (let i = 0; i < timetable.length; i++) {
            const start = addMinutes(padTime(timetable[i].start_time), delay);
            if (nowTime < start) {
              searchStartIndex = i;
              break;
            }
          }
        }

        for (let i = searchStartIndex; i < timetable.length; i++) {
          const item = timetable[i];
          if (item.type === 'song' || item.type === 'ステージ（演奏・企画）') {
            nextStageItem = item;
            break;
          }
        }

        const nextTag = document.getElementById('nextTag');
        const nextTime = document.getElementById('nextTime');

        if (nextStageItem) {
          const origStart = padTime(nextStageItem.start_time);
          if (delay > 0) {
            const delayedStart = addMinutes(origStart, delay);
            nextTime.innerHTML = `<span class="time-orig-struck">${origStart}</span><span class="time-delayed">${delayedStart}</span> 〜`;
          } else {
            nextTime.innerText = `${origStart} 〜`;
          }

          nextTag.innerText = "NEXT STAGE ▶";
          nextTime.style.display = 'flex';
        } else {
          nextTag.innerText = "今日の演目は終了しました";
          nextTime.style.display = 'none';
        }
      } catch (e) {
        console.warn("次のステージ取得エラー:", e);
      }
    }

    setInterval(fetchNextStage, 3000);
    fetchNextStage();
  </script>
</body>
</html>
