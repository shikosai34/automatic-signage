<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background-color: transparent !important;
      overflow: hidden;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Kiwi Maru', serif;
    }

    .announce-container {
      background: rgba(11, 48, 65, 0.85);
      border: 2px solid rgba(255, 153, 51, 0.6);
      border-left: 8px solid #FF9933;
      border-radius: 8px;
      padding: 16px 32px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 12px;
      backdrop-filter: blur(4px);
    }

    .target-name {
      font-size: 36px;
      font-weight: 500;
      color: #FFFFFF;
      letter-spacing: 2px;
      text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .time-message {
      font-size: 28px;
      font-weight: 400;
      color: #E8E8E8;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    /* 枠や背景色を消し、文字サイズと色（水色）のみ指定 */
    .time-highlight {
      color: #00FFCC;
      font-size: 32px;
      font-weight: 500;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.4);
    }
  </style>
</head>
<body>

  <div class="announce-container" id="announceBox" style="display: none;">
    <div class="target-name" id="targetName">読込中...</div>
    <div class="time-message">
      <span>は</span>
      <span class="time-highlight" id="timeHighlight">--:--</span>
      <span>に開始いたします。</span>
    </div>
  </div>

  <script>
    const API_URL = 'https://shikosai-signage-api.shikosai.workers.dev/api/state';

    function padTime(t) {
      if (!t) return '';
      const p = t.split(':');
      return p.length === 2 ? ('0' + p[0]).slice(-2) + ':' + ('0' + p[1]).slice(-2) : t;
    }

    function addMinutes(timeStr, minutesToAdd) {
      if (!timeStr || minutesToAdd === 0) return timeStr;
      const parts = timeStr.split(':');
      let h = parseInt(parts[0], 10);
      let m = parseInt(parts[1], 10) + minutesToAdd;
      h += Math.floor(m / 60);
      m = m % 60;
      return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    }

    async function fetchBreakAnnounce() {
      try {
        const res = await fetch(API_URL + '?t=' + Date.now());
        const data = await res.json();
        const state = data.state || {};
        const timetable = data.timetable || [];
        const delay = parseInt(state.delay_minutes, 10) || 0;
        let currentIndex = state.current_index;

        let nextStageItem = null;
        
        let searchStartIndex = currentIndex >= 0 ? currentIndex + 1 : 0;

        for (let i = searchStartIndex; i < timetable.length; i++) {
          const item = timetable[i];
          if (item.type === 'song' || item.type === 'ステージ（演奏・企画）') {
            nextStageItem = item;
            break;
          }
        }

        if (!nextStageItem && currentIndex === -1) {
          for (let i = 0; i < timetable.length; i++) {
            const item = timetable[i];
            if (item.type === 'song' || item.type === 'ステージ（演奏・企画）') {
              nextStageItem = item;
              break;
            }
          }
        }

        const announceBox = document.getElementById('announceBox');
        const targetNameEl = document.getElementById('targetName');
        const timeHighlightEl = document.getElementById('timeHighlight');

        if (nextStageItem) {
          const nBand = (nextStageItem.band || '').trim();
          const nTitle = (nextStageItem.title || '').trim();
          
          // 詳細は省き、団体名があれば団体名、無ければタイトルを表示
          const displayTitle = nBand ? nBand : (nTitle ? nTitle : '次のステージ');

          const origStart = padTime(nextStageItem.start_time);
          const delayedStart = addMinutes(origStart, delay);

          targetNameEl.innerText = displayTitle;
          
          // 遅延していても枠なし・赤色なしで通常通り表示
          timeHighlightEl.innerText = delayedStart;

          announceBox.style.display = 'flex';
        } else {
          targetNameEl.innerText = "本日のステージ演目は";
          timeHighlightEl.innerText = "すべて終了";
          document.querySelector('.time-message span:first-child').style.display = 'none';
          document.querySelector('.time-message span:last-child').innerText = "いたしました。";
          announceBox.style.display = 'flex';
        }
      } catch (e) {
        console.warn("アナウンス取得エラー:", e);
      }
    }

    setInterval(fetchBreakAnnounce, 3000);
    fetchBreakAnnounce();
  </script>
</body>
</html>
