<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background-color: transparent !important;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    ::-webkit-scrollbar { display: none; }

    .ticker-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .ticker-text {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      white-space: nowrap;
      font-family: 'Kiwi Maru', serif;
      font-size: 60px;
      font-weight: 500;
      color: #E8E8E8;
      /* ★ シアンのネオン発光エフェクトを追加 */
      text-shadow: 0 0 10px #00FFCC, 0 0 20px #00FFCC, 2px 2px 4px rgba(0, 0, 0, 0.9);
      visibility: hidden;
      will-change: transform;
    }
  </style>
</head>
<body>

  <div class="ticker-wrap" id="wrap"></div>

  <script>
    const SCROLL_SPEED = 150;
    const GAP_BETWEEN = 160;

    const wrap = document.getElementById('wrap');
    let lastTime = 0;
    const queue = [];
    const activeItems = [];

    function checkTicker() {
      const script = document.createElement('script');
      script.src = 'ticker_data.js?t=' + Date.now();
      script.onload = () => {
        script.remove();
        if (typeof latestTickerTime !== 'undefined' && latestTickerTime !== lastTime) {
          lastTime = latestTickerTime;
          queue.push(latestTickerText);
        }
      };
      script.onerror = () => { script.remove(); };
      document.body.appendChild(script);
    }

    function spawnTicker(text) {
      const el = document.createElement('div');
      el.className = 'ticker-text';
      el.innerText = text;
      wrap.appendChild(el);

      const wrapWidth = wrap.clientWidth || window.innerWidth;
      const textWidth = el.scrollWidth;

      let currentX = wrapWidth;
      el.style.transform = `translate3d(${currentX}px, -50%, 0)`;
      el.style.visibility = 'visible';

      activeItems.push({ el: el, x: currentX, width: textWidth });
    }

    let lastTimestamp = null;
    function animateLoop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const deltaTime = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      const moveDistance = SCROLL_SPEED * deltaTime;

      for (let i = activeItems.length - 1; i >= 0; i--) {
        const item = activeItems[i];
        item.x -= moveDistance;
        item.el.style.transform = `translate3d(${item.x}px, -50%, 0)`;

        if (item.x + item.width < -100) {
          item.el.remove();
          activeItems.splice(i, 1);
        }
      }

      if (queue.length > 0) {
        const wrapWidth = wrap.clientWidth || window.innerWidth;
        let canSpawn = false;

        if (activeItems.length === 0) {
          canSpawn = true;
        } else {
          const lastItem = activeItems[activeItems.length - 1];
          const lastItemRightEdge = lastItem.x + lastItem.width;
          if (lastItemRightEdge <= wrapWidth - GAP_BETWEEN) {
            canSpawn = true;
          }
        }

        if (canSpawn) {
          const nextText = queue.shift();
          spawnTicker(nextText);
        }
      }

      requestAnimationFrame(animateLoop);
    }

    setInterval(checkTicker, 400);
    requestAnimationFrame(animateLoop);
  </script>
</body>
</html>
