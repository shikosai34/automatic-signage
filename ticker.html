<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
    body {
        margin: 0; padding: 0;
        /* 背景を完全に透明化 */
        background-color: rgba(0, 0, 0, 0) !important; 
        color: #FF9933 !important;
        font-family: 'Meiryo', 'Hiragino Kaku Gothic ProN', sans-serif;
        font-size: 40px;
        font-weight: bold;
        overflow: hidden;
        position: relative;
        height: 100vh;
        display: flex;
        align-items: center;
    }
    .ticker-item {
        position: absolute;
        white-space: nowrap;
        transform: translateX(100vw);
    }
</style>
</head>
<body>
    <script>
        let lastPlayedTime = 0;

        function fetchTicker() {
            const script = document.createElement('script');
            script.src = 'ticker_data.js?t=' + Date.now();
            script.onload = () => {
                if (typeof latestTickerText !== 'undefined' && typeof latestTickerTime !== 'undefined') {
                    if (latestTickerTime !== lastPlayedTime && latestTickerText.trim() !== "") {
                        lastPlayedTime = latestTickerTime;
                        playTicker(latestTickerText);
                    }
                }
                script.remove();
            };
            script.onerror = () => { script.remove(); };
            document.body.appendChild(script);
        }

        function playTicker(text) {
            const el = document.createElement('div');
            el.className = 'ticker-item';
            el.innerText = text;
            document.body.appendChild(el);

            const duration = text.length * 0.3 + 4;

            setTimeout(() => {
                el.style.transition = `transform ${duration}s linear`;
                el.style.transform = 'translateX(-100%)';
            }, 100);

            setTimeout(() => {
                el.remove();
            }, duration * 1000 + 500);
        }

        setInterval(fetchTicker, 300);
    </script>
</body>
</html>
