<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background-color: transparent !important;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    ::-webkit-scrollbar { display: none; }

    .ticker-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    .ticker-text {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      white-space: nowrap;
      font-family: 'Kiwi Maru', serif;
      font-size: 42px;
      font-weight: 500;
      color: #E8E8E8;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
      visibility: hidden; /* ★ 画面外にセットされるまで完全に隠す（左端チラつき防止） */
      will-change: transform;
    }
  </style>
</head>
<body>

  <div class="ticker-wrap" id="wrap"></div>

  <script>
    const SCROLL_SPEED = 140; // 1秒に進むピクセル数
    const GAP_BETWEEN = 160;  // 文字と文字の間のすき間（px）

    const wrap = document.getElementById('wrap');
    let lastTime = 0;
    const queue = []; // 待機キュー
    const activeItems = []; // 現在画面を流れている要素

    // 1. Pythonからの新着テロップを監視してキューに追加
    function checkTicker() {
      const script = document.createElement('script');
      script.src = 'ticker_data.js?t=' + Date.now();
      script.onload = () => {
        script.remove();
        if (typeof latestTickerTime !== 'undefined' && latestTickerTime !== lastTime) {
          lastTime = latestTickerTime;
          // 新しいテロップを待機リストに入れる
          queue.push(latestTickerText);
        }
      };
      script.onerror = () => { script.remove(); };
      document.body.appendChild(script);
    }

    // 2. テロップを発進させる関数
    function spawnTicker(text) {
      const el = document.createElement('div');
      el.className = 'ticker-text';
      el.innerText = text;
      wrap.appendChild(el);

      // 幅を計測
      const wrapWidth = wrap.clientWidth || window.innerWidth;
      const textWidth = el.scrollWidth;

      // 最初は画面の右端外側に配置して表示開始
      let currentX = wrapWidth;
      el.style.transform = `translate3d(${currentX}px, -50%, 0)`;
      el.style.visibility = 'visible';

      activeItems.push({
        el: el,
        x: currentX,
        width: textWidth
      });
    }

    // 3. 毎フレーム実行される高精度スクロールループ（requestAnimationFrame）
    let lastTimestamp = null;
    function animateLoop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const deltaTime = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      // 画面上の全文字を左へ移動
      const moveDistance = SCROLL_SPEED * deltaTime;

      for (let i = activeItems.length - 1; i >= 0; i--) {
        const item = activeItems[i];
        item.x -= moveDistance;
        item.el.style.transform = `translate3d(${item.x}px, -50%, 0)`;

        // 左端の外に完全に抜けきったら削除
        if (item.x + item.width < -100) {
          item.el.remove();
          activeItems.splice(i, 1);
        }
      }

      // ★ 次のテロップを発進できるか判定（干渉チェック）
      if (queue.length > 0) {
        const wrapWidth = wrap.clientWidth || window.innerWidth;
        let canSpawn = false;

        if (activeItems.length === 0) {
          // 画面に何も流れていなければ即座に発進
          canSpawn = true;
        } else {
          // 直前に流した文字のお尻（右端の位置）をチェック
          const lastItem = activeItems[activeItems.length - 1];
          const lastItemRightEdge = lastItem.x + lastItem.width;

          // 前の文字のお尻が画面内に入り、指定した隙間（GAP_BETWEEN）が空いたら発進
          if (lastItemRightEdge <= wrapWidth - GAP_BETWEEN) {
            canSpawn = true;
          }
        }

        if (canSpawn) {
          const nextText = queue.shift();
          spawnTicker(nextText);
        }
      }

      requestAnimationFrame(animateLoop);
    }

    // 監視とアニメーション開始
    setInterval(checkTicker, 400);
    requestAnimationFrame(animateLoop);
  </script>
</body>
</html>
