<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920,height=1080,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>茨香祭 OBS Overlay</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Arial,"Yu Gothic UI",Meiryo,sans-serif}.canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:top left}.right-rail{position:absolute;inset:0 0 0 auto;width:31.8%;background-color:#062a34;background-image:linear-gradient(30deg,transparent 49.5%,#ffffff0b 50%,transparent 50.5%),linear-gradient(150deg,transparent 49.5%,#ffffff0b 50%,transparent 50.5%),linear-gradient(90deg,#ffffff08 1px,transparent 1px),linear-gradient(#ffffff08 1px,transparent 1px);background-size:52px 30px,52px 30px,52px 30px,52px 30px;border-left:2px solid #007d8d}.masthead{height:180px;display:flex;align-items:center;justify-content:space-between;padding:28px 38px;color:#ff9e3e}.festival{font-size:56px;line-height:.9;font-weight:900;letter-spacing:.08em;text-shadow:0 3px #062a34}.festival em{display:block;color:#69f3c8;font-style:normal;margin-left:32px}.clock{font:56px/1 monospace;color:#e9ea54}.circle-card{position:absolute;top:18%;left:9%;right:9%;height:58%;padding:22px;border:2px solid #ff9e3e;background:#062a34e8;display:flex;flex-direction:column;gap:16px}.circle-title{font-size:28px;font-weight:800;min-height:38px;border-bottom:1px dashed #ff9e3e;padding-bottom:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cut{flex:1;min-height:0;background:#087f91;display:grid;place-items:center;overflow:hidden}.cut img{width:100%;height:100%;object-fit:contain}.cut-placeholder{font-size:30px;font-weight:800}.circle-caption{font-size:18px;font-weight:700;color:#d3e4e5}.lower-third{position:absolute;left:0;bottom:16.4%;width:70.5%;height:13.2%;padding:14px 38px;background:#ff9636;color:white;clip-path:polygon(0 0,96% 0,100% 100%,0 100%);display:grid;grid-template-columns:18% 1fr 29%;align-items:center;gap:18px}.lower-third:after{content:"";position:absolute;right:0;top:0;width:15px;height:100%;background:#052a33;transform:skew(-13deg) translateX(6px)}.stage-label{font-size:22px;color:#42f1d0;font-weight:900;letter-spacing:.1em;text-shadow:0 2px #006377}.program{text-align:center;min-width:0}.program-title{font-size:48px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.program-description{font-size:25px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.end-time{background:#052a33;color:#45e9c2;padding:10px 14px;font-size:20px;font-weight:800;white-space:nowrap;text-align:center}.end-time b{color:#ff4d5a}.next{position:absolute;left:2.5%;bottom:11.4%;height:5.2%;width:56%;border:1px solid #ff9636;background:#061c25f0;display:flex;align-items:center;gap:18px;padding:0 18px;font-size:22px;white-space:nowrap;overflow:hidden}.next-label{color:#ff9636;font-weight:900}.next-time{color:#ff565e;font-weight:900}.next-title{overflow:hidden;text-overflow:ellipsis}.notice-strip{position:absolute;left:2.5%;right:33.3%;bottom:2.3%;height:6.5%;display:grid;align-items:center;gap:18px;color:#76f1d8;font-size:30px;font-weight:800;text-shadow:0 0 9px #00d9c0}.notice-strip.two-column{grid-template-columns:1fr 1fr}.notice-strip span{min-width:0;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-height:1.25}.notice-strip:not(.two-column) span{white-space:nowrap;display:block;text-overflow:ellipsis}.mode-label{position:absolute;right:33.5%;top:3%;padding:7px 12px;border:1px solid #fff6;background:#001821cc;font:16px monospace;letter-spacing:.1em}.mode-label:empty{display:none}
  </style>
</head>
<body>
  <main class="canvas" id="canvas" aria-label="茨香祭 OBS配信テロップ">
    <aside class="right-rail">
      <header class="masthead"><div class="festival">茨香祭<em>SHIKOSAI</em></div><time class="clock" id="clock">--:--</time></header>
      <section class="circle-card"><div class="circle-title" id="circleName">団体名</div><div class="cut" id="cut"><span class="cut-placeholder">サークルカット</span></div><div class="circle-caption" id="circleDescription"></div></section>
    </aside>
    <div class="mode-label" id="mode"></div>
    <section class="lower-third"><div class="stage-label">ステージ</div><div class="program"><div class="program-title" id="programTitle">企画名</div><div class="program-description" id="programDescription"></div></div><div class="end-time" id="endTime">終了 --:-- まで</div></section>
    <section class="next"><span class="next-label">NEXT ▶</span><span class="next-time" id="nextTime">--:--</span><span class="next-title" id="nextTitle">次の企画</span></section>
    <section class="notice-strip" id="notices" aria-live="polite"></section>
  </main>
  <script>
    const el=(id)=>document.getElementById(id);
    function resizeCanvas(){const scale=Math.min(innerWidth/1920,innerHeight/1080);el('canvas').style.transform=`scale(${scale})`;el('canvas').style.left=`${(innerWidth-1920*scale)/2}px`;el('canvas').style.top=`${(innerHeight-1080*scale)/2}px`}
    resizeCanvas();addEventListener('resize',resizeCanvas);
    function splitNotice(value){const chars=Array.from(value);if(chars.length<78)return [value];const middle=Math.ceil(chars.length/2);let pivot=chars.indexOf('。',middle-12);if(pivot<0||pivot>middle+12)pivot=middle;return [chars.slice(0,pivot+1).join(''),chars.slice(pivot+1).join('')]}
    const demoPreview=new URLSearchParams(location.search).get('demo')==='1';
    async function refresh(){try{const endpoint=demoPreview?'/api/broadcast-state?demo=1':'/api/broadcast-state';const r=await fetch(endpoint,{cache:'no-store'});if(!r.ok)return;const d=await r.json();const p=d.current||{};const n=d.next||{};el('clock').textContent=d.now||'--:--';el('programTitle').textContent=p.title||'次の企画をお待ちください';el('programDescription').textContent=p.class_name||p.description||'';el('endTime').innerHTML=`終了 <b>${p.end_time||'--:--'}</b> まで`;el('nextTime').textContent=n.adjusted_start||n.scheduled_start||'--:--';el('nextTitle').textContent=n.title||'次の企画は未登録';el('circleName').textContent=d.sidebar?.name||p.class_name||'茨香祭';el('circleDescription').textContent=d.sidebar?.description||d.sidebar?.program_description||'';const cut=el('cut');cut.replaceChildren();if(d.sidebar?.circle_cut_path){const img=document.createElement('img');img.src=d.sidebar.circle_cut_path;img.alt='';cut.append(img)}else{const label=document.createElement('span');label.className='cut-placeholder';label.textContent='サークルカット';cut.append(label)}const notice=(d.notices||[]).filter(x=>x.is_active).map(x=>x.text).join('　　◆　　');const parts=splitNotice(notice);const box=el('notices');box.classList.toggle('two-column',parts.length>1);box.replaceChildren(...parts.map(t=>{const span=document.createElement('span');span.textContent=t;return span}));el('mode').textContent=demoPreview?'DEMO PREVIEW':''}catch{}}
    refresh();setInterval(refresh,1000);
  </script>
</body>
</html>
