<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }

    html, body {
      background-color: transparent !important;
      overflow: hidden !important;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      font-family: 'Kiwi Maru', serif;
    }

    .stack-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 1100px;
      transition: opacity 0.3s ease;
    }

    /* 1段目：オレンジ帯本体 */
    .program-content-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: calc(100% - 40px);
      min-width: 850px;
      padding: 10px 50px 12px 28px;
      margin-right: 40px;
      z-index: 1;
      filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.5));
      white-space: nowrap;
    }

    .program-content-wrapper::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #FF9933;
      clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 100%, 0 100%);
      z-index: -1;
    }

    .program-content-wrapper::after {
      content: "";
      position: absolute;
      top: 0; 
      right: -36px;
      width: 40px;
      height: 100%;
      background-color: #FF9933;
      clip-path: polygon(0 0, 12px 0, 42px 100%, 30px 100%);
      z-index: -1;
    }

    /* 左側バッジ */
    .left-badge-area {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .badge-inline {
      font-size: 18px;
      font-weight: 500;
      color: #00FFCC;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
      white-space: nowrap;
    }

    /* 中央：テキスト */
    .center-text-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 16px;
    }

    .program-main-text {
      font-size: 38px;
      font-weight: 500;
      color: #FFFFFF;
      line-height: 1.15;
      letter-spacing: 1.5px;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
      white-space: nowrap;
    }

    .program-sub-text {
      font-size: 20px;
      font-weight: 400;
      color: #FFF5EE;
      line-height: 1.25;
      letter-spacing: 1px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.25);
      white-space: nowrap;
      margin-top: 2px;
    }

    /* 右側：終了時間（帯の中に馴染むインライン） */
    .right-time-area {
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .end-time-inside {
      background: rgba(10, 25, 40, 0.85);
      border: 1px solid rgba(0, 255, 204, 0.6);
      color: #00FFCC;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
      padding: 5px 12px;
      border-radius: 4px;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
      box-shadow: 0 0 8px rgba(0, 255, 204, 0.25);
      white-space: nowrap;
    }

    /* ★ 乗り換えアプリ風の赤打ち消し線＆赤文字スタイル */
    .time-orig-struck {
      text-decoration: line-through;
      text-decoration-color: #ff3344;
      text-decoration-thickness: 2px;
      color: #94a3b8;
      margin-right: 6px;
    }

    .time-delayed {
      color: #ff4d4f;
      font-weight: bold;
      text-shadow: 0 0 6px rgba(255, 77, 79, 0.6);
    }

    /* 2段目：次（細長バー） */
    .next-box {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(10, 25, 40, 0.9);
      border-left: 4px solid #FF9933;
      border-top: 1px solid rgba(255, 153, 51, 0.3);
      border-right: 1px solid rgba(255, 153, 51, 0.3);
      border-bottom: 1px solid rgba(255, 153, 51, 0.3);
      padding: 4px 18px 4px 12px;
      border-radius: 0 6px 6px 0;
      white-space: nowrap;
      box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
      width: fit-content;
      max-width: 100%;
    }

    .next-tag {
      font-size: 14px;
      font-weight: 500;
      color: #FF9933;
      letter-spacing: 1px;
    }

    .next-time {
      font-size: 16px;
      font-weight: 500;
      color: #00FFCC;
      letter-spacing: 0.5px;
    }

    .next-title {
      font-size: 18px;
      font-weight: 400;
      color: #F1F5F9;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="stack-container" id="programContainer" style="display: none;">
    <div class="program-content-wrapper">
      <div class="left-badge-area">
        <span class="badge-inline" id="progTag">ステージ</span>
      </div>
      
      <div class="center-text-area">
        <div class="program-main-text" id="progMain"></div>
        <div class="program-sub-text" id="progSub"></div>
      </div>

      <div class="right-time-area">
        <span class="end-time-inside" id="progEndTime">終了 --:-- まで</span>
      </div>
    </div>

    <div class="next-box" id="nextBox" style="display: none;">
      <span class="next-tag">NEXT ▶</span>
      <span class="next-time" id="nextTime"></span>
      <span class="next-title" id="nextTitle"></span>
    </div>
  </div>

  <script>
    const API_URL = 'https://shikosai-signage-api.shikosai.workers.dev/api/state';

    function padTime(t) {
      if (!t) return '';
      const p = t.split(':');
      return p.length === 2 ? ('0' + p[0]).slice(-2) + ':' + ('0' + p[1]).slice(-2) : t;
    }

    // ★ 分を加算して「HH:MM」を返す関数（遅延計算用）
    function addMinutes(timeStr, minutesToAdd) {
      if (!timeStr || minutesToAdd === 0) return timeStr;
      const parts = timeStr.split(':');
      let h = parseInt(parts[0], 10);
      let m = parseInt(parts[1], 10) + minutesToAdd;
      h += Math.floor(m / 60);
      m = m % 60;
      return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
    }

    function getCurrentTimeStr() {
      const now = new Date();
      return String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    }

    async function fetchProgramState() {
      try {
        const res = await fetch(API_URL + '?t=' + Date.now());
        const data = await res.json();
        const state = data.state || {};
        const timetable = data.timetable || [];
        const isAuto = state.is_auto !== 0;
        const delay = parseInt(state.delay_minutes, 10) || 0; // ★ 遅延分数を取得
        const nowTime = getCurrentTimeStr();

        let currentIndex = state.current_index;

        if (isAuto) {
          currentIndex = -1;
          for (let i = 0; i < timetable.length; i++) {
            // ★ 遅延分数を加味して現在の演目を判定
            const start = addMinutes(padTime(timetable[i].start_time), delay);
            const end = addMinutes(padTime(timetable[i].end_time), delay);
            if (nowTime >= start && nowTime < end) {
              currentIndex = i;
              break;
            }
          }
        }

        const container = document.getElementById('programContainer');
        const tagEl = document.getElementById('progTag');
        const mainEl = document.getElementById('progMain');
        const subEl = document.getElementById('progSub');
        const endTimeEl = document.getElementById('progEndTime');
        const nextBox = document.getElementById('nextBox');
        const nextTime = document.getElementById('nextTime');
        const nextTitle = document.getElementById('nextTitle');

        if (currentIndex >= 0 && timetable[currentIndex]) {
          const item = timetable[currentIndex];
          const isSong = (item.type === 'song' || item.type === 'ステージ（演奏・企画）');

          if (!isSong) {
            container.style.display = 'none';
            return;
          }

          tagEl.innerText = item.badge || 'ステージ';
          const bandText = (item.band || '').trim();
          const titleText = (item.title || '').trim();

          if (bandText && titleText) {
            mainEl.innerText = bandText;
            subEl.innerText = titleText;
            subEl.style.display = 'block';
          } else {
            mainEl.innerText = bandText || titleText || '無題';
            subEl.style.display = 'none';
          }

          // ★ 現在の演目：終了時間の遅延表示（乗り換え案内風）
          const origEnd = padTime(item.end_time);
          if (delay > 0) {
            const delayedEnd = addMinutes(origEnd, delay);
            endTimeEl.innerHTML = `終了 <span class="time-orig-struck">${origEnd}</span><span class="time-delayed">${delayedEnd}</span> まで`;
          } else {
            endTimeEl.innerText = `終了 ${origEnd} まで`;
          }

          // ★ 次の演目：開始時間の遅延表示
          if (currentIndex + 1 < timetable.length) {
            const nextItem = timetable[currentIndex + 1];
            const nBand = (nextItem.band || '').trim();
            const nTitle = (nextItem.title || '').trim();
            const displayTitle = nBand && nTitle ? `${nBand} - ${nTitle}` : (nBand || nTitle || '未定');

            const origStart = padTime(nextItem.start_time);
            if (delay > 0) {
              const delayedStart = addMinutes(origStart, delay);
              nextTime.innerHTML = `<span class="time-orig-struck">${origStart}</span><span class="time-delayed">${delayedStart}</span>〜`;
            } else {
              nextTime.innerText = `${origStart}〜`;
            }

            nextTitle.innerText = displayTitle;
            nextBox.style.display = 'inline-flex';
          } else {
            nextBox.style.display = 'none';
          }

          container.style.display = 'flex';
        } else {
          container.style.display = 'none';
        }
      } catch (e) {
        console.warn("演目取得エラー:", e);
      }
    }

    setInterval(fetchProgramState, 3000);
    fetchProgramState();
  </script>
</body>
</html>
